<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ deck.title }}</title>
    {# 발표 화면은 사이트 레이아웃(헤더·푸터) 없이 전체 화면으로 띄운다. #}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
    <style>
        :root {
            --r-main-font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            --r-heading-font: var(--r-main-font);
            --r-main-font-size: 34px;
            --r-heading-text-transform: none;
        }
        /* 16:9 (1280×720, Marp 기본과 같음) — 화면에 맞게 전체가 비율로 줄고 는다 */
        .reveal .slides section { text-align: left; font-size: 0.95em; padding: 14px 22px !important; box-sizing: border-box; }
        .reveal .slides section > :first-child { margin-top: 0; }
        /* 장표 경계 — 1280×720 캔버스에 테두리, 바깥은 옅은 회색 (2026-11-20 연구자 지시) */
        .reveal-viewport { background: #e2e8f0; }
        .reveal .slides { background: #fff; box-shadow: 0 2px 12px rgba(15,23,42,.15); }
        /* 검은 네모 테두리 — 캔버스 안쪽 끝에 그려 창 끝에서 잘리지 않게 (2026-11-20 연구자 지시) */
        .reveal .slides::after { content: ""; position: absolute; inset: 0; border: 3px solid #000; pointer-events: none; z-index: 50; }
        .reveal h1 { font-size: 1.9em; }
        .reveal h2 { font-size: 1.3em; margin-bottom: .3em; }
        .reveal h3 { font-size: 1.05em; }
        /* 표는 장 폭을 다 쓴다 — 가운데 작은 표로 여백이 남던 것 (2026-11-20 연구자 지시) */
        .reveal table { font-size: 0.85em; width: 100%; margin: .4em 0; }
        .reveal section.dense table { font-size: 0.75em; } /* 긴 칸이 많은 표 — `<!-- _class: dense -->` */
        .reveal table th, .reveal table td { padding: .25em .6em; }
        .reveal pre { font-size: .7em; width: 100%; box-shadow: none; }
        .reveal ul ul, .reveal ol ol { font-size: .9em; }
        /* 세로 배치: 제목은 위, 나머지는 남은 높이의 가운데로 — 위 절반에만 몰리던 것 (2026-11-20 연구자 지시)
           보이는 장(.present)에만 flex 를 준다 — 숨은 장은 reveal 이 display:none 으로 둔다 */
        .reveal .slides > section.present:not(.lead) { display: flex !important; flex-direction: column; height: 720px; }
        .reveal .slides > section.present:not(.lead) > h2:first-child { margin-bottom: auto; }
        .reveal .slides > section.present:not(.lead)::after { content: ""; margin-top: auto; }
        /* Marp `<!-- _class: lead -->` — 가운데 정렬 표지·절 구분 */
        .reveal section.lead { text-align: center; padding-top: 200px !important; } /* center: false 라서 lead 장만 아래로 내려 가운데처럼 */
        .reveal section.lead h1 { font-size: 2.4em; }
        .reveal section.lead h2 { font-size: 1.6em; }
        .reveal section.lead p { color: #64748b; }
        /* Marp `<!-- _class: invert -->` */
        .reveal section.invert { color: #f8fafc; }
        /* `<!-- _class: hangul -->` — 번호 목록을 가, 나, 다로 */
        .reveal section.hangul ol { list-style-type: korean-hangul-formal; }
        .reveal section.hangul ol { list-style-type: hangul; }
        /* `<!-- _class: small -->` — 글이 많은 장 */
        .reveal section.small { font-size: .65em; }
        /* GitHub 알림 > [!NOTE] … (VS Code·nvim 미리 보기와 같은 색) */
        .reveal .callout { border-left: .25em solid; padding: .3em .8em; margin: .5em 0; border-radius: .2em; font-size: .85em; }
        .reveal .callout p { margin: .2em 0; }
        .reveal .callout-title { font-weight: 700; }
        .reveal .callout-note { border-color: #0969da; background: #ddf4ff; }
        .reveal .callout-tip { border-color: #1a7f37; background: #dafbe1; }
        .reveal .callout-important { border-color: #8250df; background: #fbefff; }
        .reveal .callout-warning { border-color: #9a6700; background: #fff8c5; }
        .reveal .callout-caution { border-color: #cf222e; background: #ffebe9; }
        .back { position: fixed; top: 12px; left: 16px; z-index: 30; font: 14px var(--r-main-font); color: #64748b; text-decoration: none; }
    </style>
</head>

<body>
    <a class="back" href="{% url 'deck_list' %}">← 강의안 목록</a>
    <div class="reveal">
        <div class="slides">
            {% for slide in deck.slides %}
            {# textarea 안의 MD는 자동 이스케이프되고, reveal.js가 원래 문자열로 읽어 렌더링한다. #}
            <section data-markdown data-separator="^\r?\n<<<slide>>>\r?\n$" data-separator-notes="^<<<notes>>>$"{% if slide.cls %} class="{{ slide.cls }}"{% endif %}{% if slide.bg_color %} data-background-color="{{ slide.bg_color }}"{% endif %}{% if slide.bg_image %} data-background-image="{{ slide.bg_image }}"{% endif %}>
                <textarea data-template>
{{ slide.body }}
{% if slide.notes %}
<<<notes>>>
{{ slide.notes }}
{% endif %}</textarea>
            </section>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script>
        Reveal.initialize({
            hash: true,
            slideNumber: "c/t",
            width: 1280,
            height: 720,
            margin: 0,          // 바깥 여백 없음 (2026-11-20 연구자 지시)
            center: false,      // 위에서부터 채운다 — 위아래 빈 공간 없앰 (lead 장만 가운데)
            minScale: 0.2,
            maxScale: 3,
            plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
        });
        // 코드 상자 글자 맞춤: 가장 긴 줄이 검은 상자 폭을 채우도록 글자를 키운다 (2026-11-20 연구자 지시)
        // 상한 — 본문 글자의 1.1배, 장 높이의 45% 를 넘지 않게
        function fitCode(slide) {
            if (!slide) return;
            slide.querySelectorAll('pre').forEach(pre => {
                const code = pre.querySelector('code');
                if (!code) return;
                pre.style.fontSize = '';
                const base = parseFloat(getComputedStyle(pre).fontSize);
                const cap = parseFloat(getComputedStyle(slide).fontSize) * 1.1;
                const avail = pre.clientWidth - 24;
                // 글 실제 폭: 잠시 inline-block 으로 재면 상자 폭이 아니라 가장 긴 줄 폭이 나온다
                const prev = [code.style.display, code.style.width, code.style.maxWidth];
                code.style.display = 'inline-block'; code.style.width = 'auto'; code.style.maxWidth = 'none';
                const need = code.scrollWidth;
                [code.style.display, code.style.width, code.style.maxWidth] = prev;
                if (!need || !avail) return;
                let size = Math.min(cap, base * avail / need);
                const lines = code.textContent.replace(/\n$/, '').split('\n').length;
                size = Math.min(size, 720 * 0.45 / (lines * 1.3));
                if (size > base) pre.style.fontSize = size.toFixed(1) + 'px';
            });
        }
        Reveal.on('ready', e => fitCode(e.currentSlide));
        Reveal.on('slidechanged', e => fitCode(e.currentSlide));
    </script>

</body>

</html>
